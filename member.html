<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>//member · alfin.ai.id</title>
<meta name="description" content="alfin.ai.id member account — your products &amp; orders.">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3f1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<style>
@font-face{font-family:"Orbitron";font-style:normal;font-weight:400 900;font-display:swap;src:url("/fonts/orbitron.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/ibmplexmono-400.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;font-display:swap;src:url("/fonts/ibmplexmono-700.woff2") format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url("/fonts/instrumentsans.woff2") format("woff2")}
:root,[data-theme="dark"]{--bg:#0c0d0f;--panel:#121417;--ink:#e8eaec;--ink-2:#9298a0;--line:#22262a;--accent:#d97757;color-scheme:dark}
[data-theme="light"]{--bg:#f4f3f1;--panel:#ffffff;--ink:#1a1c1e;--ink-2:#6b7078;--line:#e2e1dd;--accent:#b5502f;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;justify-content:center;transition:background-color .25s ease,color .25s ease}
::selection{background:var(--accent);color:var(--bg)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
svg{display:block}
.ic{width:1.15rem;height:1.15rem;color:var(--ink-2);flex-shrink:0}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;z-index:0}
.ticks i{position:fixed;width:14px;height:14px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);pointer-events:none;z-index:10}
.ticks i:nth-child(1){top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));border-right:0;border-bottom:0}
.ticks i:nth-child(2){top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));border-left:0;border-bottom:0}
.ticks i:nth-child(3){bottom:calc(12px + env(safe-area-inset-bottom));left:calc(12px + env(safe-area-inset-left));border-right:0;border-top:0}
.ticks i:nth-child(4){bottom:calc(12px + env(safe-area-inset-bottom));right:calc(12px + env(safe-area-inset-right));border-left:0;border-top:0}
main{position:relative;z-index:1;width:100%;max-width:64rem;padding:clamp(1.25rem,4vw,2.25rem) clamp(1.1rem,4vw,2.5rem) 2.5rem;display:flex;flex-direction:column;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:2rem}
.brand{display:flex;align-items:center;gap:.55rem;font-family:"Orbitron",sans-serif;font-weight:800;font-size:.85rem;color:var(--ink);text-decoration:none;letter-spacing:.1em}
.b-mark{width:26px;height:26px;border-radius:7px;display:block}
.brand em{font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;font-size:.78em;letter-spacing:.06em;color:var(--accent);margin-left:.12em}
.cursor{display:inline-block;width:.5em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:.25em}
@media (prefers-reduced-motion:no-preference){.cursor{animation:blink 1.15s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}}
.icon-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;background:none;border:0;color:var(--ink-2);text-decoration:none;cursor:pointer;transition:color .18s ease}
.icon-btn:hover{color:var(--accent)}
.icon-btn .ic{width:1.2rem;height:1.2rem}
.icon-btn[hidden]{display:none}
.menu{position:relative}
.menu>summary{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:var(--ink-2);list-style:none;cursor:pointer;border-radius:8px;transition:color .18s ease}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover,.menu[open]>summary{color:var(--accent)}
.menu>summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.menu .ic{width:1.2rem;height:1.2rem}
.menu-list{position:absolute;top:calc(100% + .45rem);right:0;z-index:20;display:flex;flex-direction:column;min-width:9.5rem;padding:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px -18px rgba(0,0,0,.55)}
.menu-list a{display:flex;align-items:center;min-height:34px;padding:0 .65rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;font-size:.76rem;letter-spacing:.06em;color:var(--ink);text-decoration:none;border-radius:6px;white-space:nowrap}
.menu-list a .sl{color:var(--accent)}
.menu-list a:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.menu-list a.dim{color:var(--ink-2);margin-top:.2rem;padding-top:.45rem;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.menu-list a[aria-current]{color:var(--accent)}
.menu[open] .menu-list{animation:menuin .14s ease-out}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
[data-theme="dark"] .i-moon{display:none}
[data-theme="light"] .i-sun{display:none}
.jumpnav{display:flex;flex-wrap:wrap;gap:.4rem .5rem;padding:.55rem 0;margin-bottom:1.5rem;border-bottom:1px solid var(--line)}
.jumpnav a{display:flex;align-items:center;min-height:40px;padding:0 .7rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;font-size:.74rem;letter-spacing:.06em;color:var(--ink);text-decoration:none;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;transition:color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.jumpnav a .sl{color:var(--accent)}
.jumpnav a:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.jumpnav a:active{transform:translateY(-2px) scale(.98)}
.jumpnav a[aria-current]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;font-size:.82rem;color:var(--accent);letter-spacing:.08em;margin-bottom:.65rem}
section{margin-bottom:1.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}
.forms{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:44rem){.forms{grid-template-columns:1fr 1fr}}
label{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;color:var(--ink-2);margin:.6rem 0 .3rem}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.8rem;padding:.55rem .7rem}
input:focus-visible{outline:none;border-color:var(--accent)}
.btn{margin-top:.8rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:8px;padding:.55rem 1rem;cursor:pointer;transition:border-color .18s ease,color .18s ease}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:progress}
.msg{margin-top:.6rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;min-height:1em}
.msg.err{color:#e05d5d}
.msg.ok{color:#4ade80}
table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem}
th{text-align:left;color:var(--accent);font-weight:700;padding:.4rem .5rem;border-bottom:1px solid var(--line);letter-spacing:.05em}
td{padding:.45rem .5rem;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
td b{color:var(--ink)}
.pill{display:inline-block;padding:.1rem .45rem;border-radius:6px;font-size:.62rem;letter-spacing:.05em}
.pill.paid{color:#4ade80;border:1px solid #4ade8055}
.pill.pending{color:#fbbf24;border:1px solid #fbbf2455}
td a{color:var(--accent);text-decoration:none}
.muted{color:var(--ink-2);font-size:.7rem;font-family:"IBM Plex Mono",ui-monospace,monospace}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
footer{margin-top:auto;border-top:1px solid var(--line);padding-top:1.1rem;display:flex;justify-content:center}
footer .icon-btn .ic{width:1.25rem;height:1.25rem}
@media (prefers-reduced-motion:no-preference){.in{animation:in .5s cubic-bezier(.22,1,.36,1) both}.in-1{animation-delay:.05s}.in-2{animation-delay:.1s}.in-3{animation-delay:.15s}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</defs></svg>
<div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main>
  <header class="in in-1">
    <a class="brand" href="/" aria-label="alfin.ai.id — home"><img class="b-mark" src="/favicon.svg" alt="" width="26" height="26"><span>ALFIN<em>.AI.ID</em></span><span class="cursor" aria-hidden="true"></span></a>
    <div class="tools">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme" hidden>
        <svg class="ic i-sun"><use href="#i-sun"/></svg>
        <svg class="ic i-moon"><use href="#i-moon"/></svg>
      </button>
      <details class="menu">
        <summary aria-label="Site menu"><svg class="ic"><use href="#i-menu"/></svg></summary>
        <nav class="menu-list" aria-label="Site map">
          <a href="/"><span class="sl">//</span>index</a>
          <a href="/gear"><span class="sl">//</span>gear</a>
          <a href="/device"><span class="sl">//</span>device</a>
          <a href="/member" aria-current="page"><span class="sl">//</span>member</a>
          <a class="dim" href="/admin"><span class="sl">//</span>admin</a>
        </nav>
      </details>
    </div>
  </header>

  <nav class="jumpnav in in-2" aria-label="Navigation">
    <a href="/"><span class="sl">//</span>index</a>
    <a href="/gear"><span class="sl">//</span>gear</a>
    <a href="/device"><span class="sl">//</span>device</a>
    <a href="/member" aria-current="page"><span class="sl">//</span>member</a>
  </nav>

  <section class="in in-3" id="auth-box" hidden>
    <h2 class="tag">// member</h2>
    <div class="forms">
      <form class="card" id="form-login">
        <h2 class="tag">login</h2>
        <label for="l-email">email</label>
        <input id="l-email" type="email" required autocomplete="email">
        <label for="l-pass">password</label>
        <input id="l-pass" type="password" required autocomplete="current-password" minlength="8">
        <button class="btn" type="submit">login →</button>
        <p class="msg" id="l-msg" role="status"></p>
      </form>
      <form class="card" id="form-register">
        <h2 class="tag">register</h2>
        <label for="r-email">email</label>
        <input id="r-email" type="email" required autocomplete="email">
        <label for="r-pass">password <span class="muted">(min 8)</span></label>
        <input id="r-pass" type="password" required autocomplete="new-password" minlength="8">
        <button class="btn" type="submit">register →</button>
        <p class="msg" id="r-msg" role="status"></p>
      </form>
    </div>
  </section>

  <section class="in in-3" id="dash" hidden>
    <div class="row-between">
      <h2 class="tag">// member</h2>
      <button class="btn" id="btn-logout" type="button">logout →</button>
    </div>
    <p class="muted" id="me-email"></p>

    <h2 class="tag" style="margin-top:1.4rem">my products</h2>
    <div class="card" style="padding:.4rem .6rem">
      <table id="tbl-ent"><thead><tr><th>product</th><th>until</th><th>source</th></tr></thead><tbody></tbody></table>
      <p class="muted" id="ent-empty" hidden>no products yet — check <a href="/#paid" style="color:var(--accent)">//paid</a>.</p>
    </div>

    <h2 class="tag" style="margin-top:1.4rem">my orders</h2>
    <div class="card" style="padding:.4rem .6rem">
      <table id="tbl-ord"><thead><tr><th>ref</th><th>product</th><th>amount</th><th>status</th><th></th></tr></thead><tbody></tbody></table>
      <p class="muted" id="ord-empty" hidden>no orders yet.</p>
    </div>
  </section>

  <footer class="in in-4"></footer>
</main>
<script src="/member.js" defer></script>
</body>
</html>
